<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lights Off Stories Connect</title>
<style>
body{background:#0f0e12;color:#e8e4de;font-family:system-ui,sans-serif;font-size:18px;line-height:1.6;margin:0;padding:60px 20px}
main{max-width:640px;margin:0 auto}
h1{font-size:1.6rem;margin:0 0 .5em}
.box{background:#1a1920;border:1px solid #2c2a30;border-radius:8px;padding:16px;word-break:break-all;font-family:ui-monospace,Consolas,monospace;font-size:15px;margin:1em 0}
button{background:#d8433c;color:#fff;border:0;border-radius:6px;padding:12px 18px;font-size:16px;cursor:pointer}
.muted{color:#9a948c}
</style>
</head>
<body>
<main>
<h1>TikTok connected. One more step.</h1>
<p>Copy this address and paste it into the bot window on your computer:</p>
<div class="box" id="url"></div>
<button id="copy">Copy address</button>
<p class="muted" id="status"></p>
<p class="muted">If there is no <code>code=</code> in the address above, TikTok denied the request; go back and try again.</p>
</main>
<script>
var u = location.href; document.getElementById('url').textContent = u;
document.getElementById('copy').onclick = function(){
  navigator.clipboard.writeText(u).then(function(){document.getElementById('status').textContent='Copied. Now paste it into the bot window and press Enter.';},
  function(){document.getElementById('status').textContent='Select the address above and copy it manually.';});
};
</script>
</body>
</html>
